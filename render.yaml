services:
  - type: web
    name: project-planner
    runtime: node
    plan: starter          # free plan has no disk; the disk below keeps the plan across deploys
    buildCommand: ""       # no dependencies to install
    startCommand: node serve.js
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /data/project.json
      - key: PLANNER_TOKEN
        sync: false        # set your team's shared key in the Render dashboard
