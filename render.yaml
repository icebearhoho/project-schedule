services:
  - type: web
    name: project-planner
    runtime: node
    plan: free               # free instances have no persistent disk, so the plan is
    startCommand: node serve.js   # stored in GitHub instead (see GITHUB_* below)
    envVars:
      - key: GITHUB_REPO
        value: icebearhoho/project-schedule
      - key: GITHUB_BRANCH
        value: plan-data     # kept off main so publishing never triggers a redeploy
      - key: GITHUB_TOKEN
        sync: false          # paste your fine-grained token in the Render dashboard
      - key: PLANNER_TOKEN
        sync: false          # your team's shared password
